<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1b2a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>电缆载流量计算器</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- 头部 -->
    <header class="header">
      <h1>⚡ 电缆载流量计算</h1>
      <p class="subtitle">三线铜/铝电缆 · 基于国标 GB/T 16895.15</p>
    </header>

    <!-- 基础参数 -->
    <section class="card">
      <div class="card-title">📋 电缆参数</div>

      <div class="form-group">
        <label>电缆材质</label>
        <div class="toggle-group" id="materialGroup">
          <button class="toggle-btn active" data-value="copper">🟠 铜芯</button>
          <button class="toggle-btn" data-value="aluminum">⚪ 铝芯</button>
        </div>
      </div>

      <div class="form-group">
        <label>截面积 (mm²)</label>
        <select id="crossSection">
          <option value="1.5">1.5</option>
          <option value="2.5">2.5</option>
          <option value="4">4</option>
          <option value="6">6</option>
          <option value="10" selected>10</option>
          <option value="16">16</option>
          <option value="25">25</option>
          <option value="35">35</option>
          <option value="50">50</option>
          <option value="70">70</option>
          <option value="95">95</option>
          <option value="120">120</option>
          <option value="150">150</option>
          <option value="185">185</option>
          <option value="240">240</option>
          <option value="300">300</option>
          <option value="400">400</option>
          <option value="500">500</option>
          <option value="630">630</option>
        </select>
      </div>

      <div class="form-group">
        <label>敷设方式</label>
        <select id="installMethod">
          <option value="air" selected>空气中敷设 (明敷)</option>
          <option value="conduit">穿管敷设</option>
          <option value="buried">埋地敷设</option>
        </select>
      </div>

      <div class="form-group">
        <label>绝缘类型</label>
        <select id="insulation">
          <option value="pvc" selected>PVC 聚氯乙烯 (70°C)</option>
          <option value="xlpe">XLPE 交联聚乙烯 (90°C)</option>
        </select>
      </div>
    </section>

    <!-- 环境参数 -->
    <section class="card">
      <div class="card-title">🌡️ 环境条件</div>

      <div class="form-group">
        <label>环境温度 (°C)</label>
        <div class="input-with-unit">
          <input type="number" id="ambientTemp" value="30" min="-10" max="80" step="1">
          <span class="unit">°C</span>
        </div>
      </div>

      <div class="form-group">
        <label>并列回路数</label>
        <select id="parallelCircuits">
          <option value="1" selected>1 回路 (无降容)</option>
          <option value="2">2 回路</option>
          <option value="3">3 回路</option>
          <option value="4">4 回路</option>
          <option value="6">5-6 回路</option>
          <option value="9">7-9 回路</option>
        </select>
      </div>
    </section>

    <!-- 计算结果 -->
    <section class="card result-card" id="resultCard">
      <div class="card-title">📊 计算结果</div>

      <div class="result-main">
        <div class="result-label">修正后载流量</div>
        <div class="result-value" id="correctedAmpacity">-- A</div>
        <div class="result-note" id="powerNote"></div>
      </div>

      <div class="result-details">
        <div class="detail-row">
          <span>基准载流量</span>
          <span id="baseAmpacity">-- A</span>
        </div>
        <div class="detail-row">
          <span>温度修正系数</span>
          <span id="tempFactor">--</span>
        </div>
        <div class="detail-row">
          <span>并列修正系数</span>
          <span id="groupFactor">--</span>
        </div>
        <div class="detail-row">
          <span>敷设方式系数</span>
          <span id="installFactor">--</span>
        </div>
        <div class="detail-row">
          <span>综合修正系数</span>
          <span id="totalFactor">--</span>
        </div>
      </div>

      <div class="voltage-section">
        <div class="form-group">
          <label>⚡ 电压降计算 (可选)</label>
          <div class="input-with-unit">
            <input type="number" id="cableLength" placeholder="电缆长度" value="" min="1" max="10000" step="1">
            <span class="unit">米</span>
          </div>
        </div>
        <div class="form-group">
          <label>系统电压</label>
          <select id="systemVoltage">
            <option value="380" selected>380V (三相)</option>
            <option value="220">220V (单相)</option>
            <option value="10000">10kV</option>
          </select>
        </div>
        <div class="form-group">
          <label>负载电流 (A)</label>
          <div class="input-with-unit">
            <input type="number" id="loadCurrent" placeholder="输入电流" value="" min="1" max="5000" step="0.1">
            <span class="unit">A</span>
          </div>
        </div>
        <div class="detail-row" style="margin-top: 8px;">
          <span>电压降</span>
          <span id="voltageDrop">-- V / -- %</span>
        </div>
      </div>
    </section>

    <!-- 参考速查表 -->
    <section class="card">
      <div class="card-title">📖 常用电缆载流量速查表</div>
      <div class="table-wrapper">
        <table id="refTable">
          <thead>
            <tr>
              <th>截面积<br>(mm²)</th>
              <th>铜芯 (A)</th>
              <th>铝芯 (A)</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <p class="table-note">* PVC绝缘 · 30°C · 空气中敷设</p>
    </section>

    <footer class="footer">
      数据参考 GB/T 16895.15 / IEC 60364-5-52
    </footer>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
